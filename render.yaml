services:
  # ==============================================================
  # 🌿 NutriTrack Full-Stack Unified Service on Render (Free Tier)
  # Serves React Frontend + Express REST API + Socket.IO WebSockets
  # ==============================================================
  - type: web
    name: nutritrack
    runtime: node
    plan: free
    region: oregon
    buildCommand: cd client && npm install && npm run build && cd ../server && npm install
    startCommand: cd server && node src/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: CLIENT_URL
        value: '*'
      - key: MONGODB_URI
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: REFRESH_TOKEN_SECRET
        generateValue: true
